[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfw"
version = "0.0.1"
description = "Utility-normalized cross-lingual evaluation of prompt-injection defenses for tool-using agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
# <9.2: pytest 9.2.0 dies at collection (INTERNALERROR: 'NodeId' object has no attribute
# '_str_cache'), found replaying CI on 2026-11-09; 9.1.1 runs the whole suite.
dev = ["pytest>=7.4,<9.2"]
classifiers-local = ["torch", "transformers", "sentencepiece", "protobuf"]
analysis = ["matplotlib", "numpy", "pandas"]

[tool.setuptools]
packages = ["corpus", "defenses", "harness", "analysis", "service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
